<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .label { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 900; letter-spacing: 2px; }
      .small { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 700; letter-spacing: 1px; }
      .outline { stroke: rgba(255,255,255,0.8); stroke-width: 6; }
      .panel { stroke: rgba(255,255,255,0.7); stroke-width: 10; }
    </style>
  </defs>

  <g id="front-shirt" transform="translate(0,0)">
    <!-- torso base -->
    <path d="M290 210 L734 210 L820 930 L204 930 Z" fill="rgba(255,255,255,0.02)"/>

    <!-- upper torso panel -->
    <rect x="256" y="170" width="512" height="186" rx="10" fill="#1F9BEA" class="panel"/>
    <rect x="256" y="356" width="512" height="214" rx="10" fill="#F4B400" class="panel"/>
    <rect x="256" y="570" width="512" height="210" rx="10" fill="#21B26B" class="panel"/>
    <rect x="256" y="780" width="512" height="150" rx="10" fill="#E64B3B" class="panel"/>

    <!-- left sleeve -->
    <path d="M204 332 L132 438 L122 850 L236 826 L274 430 Z" fill="#16A4E9" class="panel"/>
    <path d="M820 332 L892 438 L902 850 L788 826 L750 430 Z" fill="#16A4E9" class="panel"/>

    <!-- design on front chest -->
    <g transform="translate(292,240)">
      <rect x="0" y="0" width="440" height="130" rx="18" fill="#F6F7F9"/>
      <rect x="18" y="20" width="94" height="92" rx="16" fill="#F4B400"/>
      <path d="M42 48 h48 v18 h-19 v22 h-10 v-22 h-19 z" fill="#ffffff" opacity="0.9"/>
      <path d="M65 34 v74 M42 60 h46 M42 88 h46" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
      <text x="145" y="72" class="label" font-size="54" fill="#1B1B1B">RESTOCK</text>
      <text x="148" y="105" class="small" font-size="20" fill="#2B7DE9" letter-spacing="4">STORE TEAM</text>
    </g>

    <!-- lower front stripe -->
    <rect x="302" y="635" width="420" height="42" rx="12" fill="#ffffff" opacity="0.92"/>
    <text x="512" y="666" text-anchor="middle" class="small" font-size="26" fill="#1d1d1f" letter-spacing="6">READY TO WORK</text>

    <!-- bottom badge -->
    <g transform="translate(444,788)">
      <circle cx="68" cy="52" r="56" fill="#F6F7F9"/>
      <circle cx="68" cy="52" r="40" fill="#21B26B"/>
      <path d="M52 52 h32 M68 36 v32 M54 64 l28 -28" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g id="back-shirt" transform="translate(0,0)">
    <!-- torso base -->
    <path d="M290 210 L734 210 L820 930 L204 930 Z" fill="rgba(255,255,255,0.02)"/>

    <!-- upper torso panel -->
    <rect x="256" y="170" width="512" height="186" rx="10" fill="#1F9BEA" class="panel"/>
    <rect x="256" y="356" width="512" height="214" rx="10" fill="#F4B400" class="panel"/>
    <rect x="256" y="570" width="512" height="210" rx="10" fill="#21B26B" class="panel"/>
    <rect x="256" y="780" width="512" height="150" rx="10" fill="#E64B3B" class="panel"/>

    <!-- left sleeve -->
    <path d="M204 332 L132 438 L122 850 L236 826 L274 430 Z" fill="#16A4E9" class="panel"/>
    <path d="M820 332 L892 438 L902 850 L788 826 L750 430 Z" fill="#16A4E9" class="panel"/>

    <!-- back art -->
    <g transform="translate(292,236)">
      <rect x="0" y="0" width="440" height="178" rx="18" fill="#F6F7F9"/>
      <path d="M36 28 h180 L136 152 H36 Z" fill="#1F9BEA"/>
      <path d="M170 28 h160 l-64 124 h-160 z" fill="#21B26B"/>
      <text x="220" y="84" text-anchor="middle" class="label" font-size="48" fill="#111827">TEAM</text>
      <text x="220" y="124" text-anchor="middle" class="label" font-size="52" fill="#111827">RESTOCK</text>
      <circle cx="98" cy="90" r="30" fill="#F4B400"/>
      <path d="M84 90 h28 M98 74 v32 M84 106 l28 -28" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <path d="M359 26 l22 0 l0 124 l-22 0 z" fill="#E64B3B"/>
      <path d="M321 36 l30 0 l0 104 l-30 0 z" fill="#F4B400"/>
    </g>

    <!-- lower back bar -->
    <rect x="315" y="645" width="394" height="42" rx="10" fill="#ffffff" opacity="0.9"/>
    <text x="512" y="676" text-anchor="middle" class="small" font-size="24" fill="#111827" letter-spacing="6">KEEP AISLES READY</text>
  </g>

  <!-- instructions label for template use -->
  <g transform="translate(52,900)">
    <text x="0" y="0" class="small" font-size="18" fill="#4A4A4A" letter-spacing="1.8">ROBUX TEMPLATE</text>
  </g>
</svg>
